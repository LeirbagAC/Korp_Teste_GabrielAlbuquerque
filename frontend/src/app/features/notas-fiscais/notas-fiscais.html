<div class="page-header">
  <div>
    <h2>Notas Fiscais</h2>
    <p>Gerencie e emita faturas para seus clientes.</p>
  </div>
  <button nz-button nzType="primary" nzSize="large" class="btn-novo" (click)="showModal()">
    <span nz-icon nzType="plus"></span> Nova Nota Fiscal
  </button>
</div>

<div class="table-container">
  <div class="table-toolbar">
    <span class="total-items">Total: {{ notas.length }} nota(s)</span>
  </div>

  <!-- Tabela -->
  <app-invoice-table 
     [notas]="notas" 
     [isLoading]="isLoadingTable"
    (visualizar)="viewNote($event)" 
    (imprimir)="printNote($event)">
  </app-invoice-table>

<!-- Modal Dinâmico de Emissão de Nota Fiscal -->
<app-nota-modal
  [isVisible]="isVisible"
  [isOkLoading]="isOkLoading"
  [notaForm]="notaForm"
  (cancel)="handleCancel()"
  (ok)="handleOk()"
  (add)="addItem()"
  (remove)="removeItem($event)">
</app-nota-modal>

<app-nota-drawer 
  [visible]="drawerVisible" 
  [nota]="noteDetails" 
  (closeDrawer)="closeDrawer()">
</app-nota-drawer>
