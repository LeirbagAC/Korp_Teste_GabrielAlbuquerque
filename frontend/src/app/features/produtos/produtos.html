<div class="page-header">
  <div>
    <h2>Controle de Produtos</h2>
    <p>Gerencie seu inventário e cadastro de itens.</p>
  </div>
  <button nz-button nzType="primary" nzSize="large" class="btn-novo" (click)="showModal()">
    <span nz-icon nzType="plus"></span> Novo Produto
  </button>
</div>

<div class="table-container">
  <div class="table-toolbar">
    <span class="total-items">Total: {{ produtos.length }} produto(s)</span>
  </div>
  
  <app-produto-table 
    [produtos]="produtos" 
    [isLoading]="isLoadingTable">
  </app-produto-table>
</div>

<app-produto-modal
  [isVisible]="isVisible"
  [isOkLoading]="isOkLoading"
  [produtoForm]="produtoForm"
  (cancel)="handleCancel()"
  (ok)="handleOk()">
</app-produto-modal>
