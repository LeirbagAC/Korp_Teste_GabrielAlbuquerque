<nz-layout style="min-height: 100vh;">
  <nz-sider nzWidth="260px" nzBreakpoint="lg" [nzCollapsedWidth]="0" nzCollapsible style="background: #27272a;">
    <app-sidebar></app-sidebar>
  </nz-sider>

  <nz-layout style="background: #ffffff;">
    <nz-header style="background: #ffffff; padding: 0 16px; height: 80px; display: flex; align-items: center; border-bottom: 1px solid transparent;">
      <div style="flex: 1; height: 100%;">
        <app-topbar></app-topbar>
      </div>
    </nz-header>
    <nz-content class="app-content">
      <router-outlet></router-outlet>
    </nz-content>
  </nz-layout>
</nz-layout>
